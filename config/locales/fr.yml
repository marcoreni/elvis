        objective_1: Adapter le contexte juridique pour suivre les évolutions des
          technologies et de nos sociétés
        objective_2: Il s’inscrit dans la continuité de la Loi française Informatique
          et Libertés de 1978 et renforce le contrôle par les citoyens de l’utilisation
          qui peut être faite des données les concernant.
        objective_3: Harmoniser les règles en Europe pour offrir un cadre juridique
          unique aux professionnels.
        objectives_intro: 'Ce règlement poursuit 3 objectifs :'
        obligations_guarantee: "%{school_name} doit garantir un niveau de protection
          élevé des données personnelles des Utilisateurs de tous ses services."
        obligations_heading: Quels sont les obligations de %{school_name} en matière
          de protection des données personnelles ?
        obligations_principles_intro: "%{school_name} doit respecter la réglementation
          applicable à l’ensemble des traitements de données personnelles qu’elle
          met en œuvre. Plus particulièrement, %{school_name_lower} s’engage notamment
          à respecter les principes suivants :"
        principle_1: vos données personnelles sont traitées de manière licite, loyale
          et transparente (licéité, loyauté, transparence) ;
        principle_2: vos données personnelles sont collectées pour des finalités déterminées,
          explicites et légitimes, et ne sont pas traitées ultérieurement d’une manière
          incompatible avec ces finalités (limitation des finalités) ;
        principle_3: vos données personnelles sont conservées de manière adéquate,
          pertinente et sont limitées à ce qui est nécessaire au regard des finalités
          pour lesquelles elles sont traitées (minimisation des données) ;
        principle_4: vos données personnelles sont exactes, tenues à jour et toutes
          les mesures raisonnables sont prises pour que les données inexactes, eu
          égard aux finalités pour lesquelles elles sont traitées, soient effacées
          ou rectifiées sans tarder (exactitude).
