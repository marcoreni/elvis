        objective_2: It continues the French Data Protection Act (Loi Informatique
          et Libertés) of 1978 and strengthens citizens' control over how data concerning
          them may be used.
        objective_3: Harmonize rules across Europe to provide a single legal framework
          for professionals.
        objectives_intro: 'This regulation pursues 3 objectives:'
        obligations_guarantee: "%{school_name} must guarantee a high level of protection
          for the personal data of all Users of its services."
        obligations_heading: What are %{school_name}'s obligations regarding the protection
          of personal data?
        obligations_principles_intro: "%{school_name} must comply with the regulations
          applicable to all the personal data processing it carries out. In particular,
          %{school_name_lower} undertakes to comply with the following principles:"
        principle_1: your personal data is processed lawfully, fairly and transparently
          (lawfulness, fairness, transparency);
        principle_2: your personal data is collected for specified, explicit and legitimate
          purposes, and is not further processed in a way incompatible with those
          purposes (purpose limitation);
        principle_3: your personal data is kept adequate, relevant and limited to
          what is necessary in relation to the purposes for which it is processed
          (data minimization);
        principle_4: your personal data is accurate, kept up to date, and every reasonable
          step is taken to ensure that inaccurate data, having regard to the purposes
          for which it is processed, is erased or rectified without delay (accuracy).
        purpose_1: Process your registration request
        purpose_2: Find the best course for the student
        purpose_3: Provide educational and administrative follow-up over a school
          season
        purposes_heading: What are the purposes?
        registration_heading: As part of a registration on the Elvis platform
