# English translations. See docs/I18n.md for the key-naming convention and how to extend this
# file — filled in incrementally as app/views/app/models strings get extracted (see
# docs/I18n-Roadmap.md, branches feature/i18n-04 onward). Structure mirrors fr.yml, the base
# locale.
en:
    time:
        formats:
            date_month_concise: '%B %d, %Y'
            long_date: '%B %e, %Y'
            day: '%A'
            short_time: '%H:%M'
    date:
        formats:
            date_month_concise: '%B %d, %Y'
