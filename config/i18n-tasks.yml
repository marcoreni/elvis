# i18n-tasks finds missing and unused translation keys.
# https://github.com/glebm/i18n-tasks — run `bundle exec i18n-tasks health` for a full report.
# See docs/I18n.md for the key-naming convention this repo follows.

base_locale: fr
locales: [fr, en]

data:
  read:
    - config/locales/%{locale}.yml
    - config/locales/devise.%{locale}.yml
  write:
    - config/locales/%{locale}.yml

search:
  paths:
    - app/
    - lib/elvis/
  relative_roots:
    - app/views
    - app/controllers
    - app/models
    - app/mailers
    - app/helpers

# translate_enum (app/models/activity_ref.rb) and Parameter-backed / NotificationTemplate content
# are outside this static UI-string sweep — see docs/I18n.md "hors périmètre".
#
# devise.*, errors.messages.* and date.month_names keys are supplied at runtime by the
# devise-i18n / rails-i18n gems (fr/en shipped inside the gems themselves), not by a
# project-level config/locales/devise.<locale>.yml — only devise.en.yml exists as a project
# override, for the handful of scaffold-era strings that were actually customized. i18n-tasks
# only reads the data files declared above, so it has no visibility into the gems' own
# translations and would otherwise flag every `t("devise....")` call (see app/views/devise/**)
# or `I18n.t("date.month_names")` (see app/helpers/date_helper.rb) as missing even though they
# resolve fine at runtime. Likewise activerecord.attributes.user.password is a devise-i18n stock
# attribute name (unmodified copy, deliberately not duplicated into fr.yml/en.yml per
# docs/I18n.md's "prefer gem stock keys" guidance) referenced directly via t() in a few devise
# views.
ignore_missing:
  - "activerecord.attributes.activity_ref.activity_type_list.*"
  - "activerecord.attributes.user.password"
  - "date.month_names"
  - "devise.**"
  - "errors.messages.*"

ignore_unused:
  # translate_enum (app/models/activity_ref.rb:123) builds these keys dynamically per enum
  # value at runtime — i18n-tasks' static scan can't see that, so it always reports them unused.
  - "activerecord.attributes.activity_ref.activity_type_list.*"
  # Rails' `validates :password, confirmation: true` (app/models/user.rb) implicitly looks up
  # this key via ActiveModel's confirmation-validator naming convention (no literal `t(...)` call
  # for i18n-tasks to find), so it's genuinely used despite the static scan saying otherwise.
  - "activerecord.errors.models.user.attributes.password_confirmation.confirmation"
  # `I18n.l`/`I18n.localize`/`l` calls with `format:` (app/models/season.rb,
  # app/views/students/index.html.erb, app/views/seasons/show.html.erb,
  # app/views/devise/registrations/new.html.erb) resolve under `time.formats.*` or
  # `date.formats.*` depending on the runtime type (Time vs. Date) of the localized value, which
  # i18n-tasks' static scan can't disambiguate from the call site alone — it only ever credits
  # one of the two namespaces as "used" per format key, leaving the other flagged unused even
  # when it's the one actually hit at runtime.
  - "time.formats.*"
  - "date.formats.*"
  # activerecord.attributes.user.{last_name,first_name}: added per the i18n-04 branch plan to
  # cover custom User fields not shipped by devise-i18n (see docs/I18n-Roadmap.md), for reuse by
  # any future form that lets Rails auto-translate these attribute names (`f.label :last_name`).
  # The devise registration form keeps its own more specific "Votre Nom"/"Votre Prénom" wording
  # (views.devise.registrations.registration.*_label) rather than switching to the bare attribute
  # name, to avoid a visible copy change while extracting strings — so these stay statically
  # unused for now, until a form actually relies on the auto-translated attribute name. Note:
  # app/views/users/new.html.erb (feature/i18n-05-extract-users) now calls
  # `User.human_attribute_name(:last_name)`/`(:first_name)` explicitly — required there because
  # that form is `form_with scope: :user` with no bound model instance, so `f.label :last_name`
  # alone can't resolve `object.class` to look up the translation and silently falls back to a
  # bare humanized ("Last name") string instead. `Model.human_attribute_name(...)` isn't a
  # `t(...)`/`I18n.t(...)` call i18n-tasks' static scan recognizes either (confirmed: removing
  # these two from ignore_unused still reports them unused), so the same "statically unused
  # despite genuine runtime use" reasoning still applies — they stay listed here.
  # `activerecord.attributes.user.birthday`, by contrast, gained a genuine explicit
  # `t("activerecord.attributes.user.birthday")` call in app/views/users/show.html.erb (a normal
  # bound `@user`, not a scope-only form, so plain `t()` was the natural choice there), which *is*
  # statically detected — so it was removed from this list.
  - "activerecord.attributes.user.last_name"
  - "activerecord.attributes.user.first_name"
  # Phase 07 P2 (feat/i18n-p2-practice-rooms-params): the practice/* and locations scaffolds
  # label their form fields with bare `f.label :attr` (no explicit string), so Rails auto-resolves
  # the label text from `activerecord.attributes.<model>.<attr>` via `Model.human_attribute_name`
  # — no literal `t(...)`/`I18n.t(...)` at the label site for the static scanner to credit, same
  # as user.{last_name,first_name} above. Leaf-listed (not `<model>.*`) so a genuinely dead key
  # added later under one of these models still gets flagged. `room_features` is the model class
  # name (app/models/room_features.rb — plural class), which is the i18n key Rails looks up. The
  # `band.*` keys are additionally reachable via `band.errors.full_messages` even though
  # practice/bands/_form.html.erb itself is dead (bands new/edit render React).
  - "activerecord.attributes.band.name"
  - "activerecord.attributes.band.band_type_id"
  - "activerecord.attributes.band.music_genre_id"
  - "activerecord.attributes.band.blacklisted"
  - "activerecord.attributes.band_type.name"
  - "activerecord.attributes.flat_rate.name"
  - "activerecord.attributes.flat_rate.nb_hour"
  - "activerecord.attributes.flat_rate.solo_duo_rate"
  - "activerecord.attributes.flat_rate.group_rate"
  - "activerecord.attributes.location.label"
  - "activerecord.attributes.material.name"
  - "activerecord.attributes.material.prix"
  - "activerecord.attributes.music_genre.name"
  - "activerecord.attributes.room_features.name"
  # activerecord.attributes.season.*: added for Phase 07 P3 (enrolment & money views). The season
  # form (app/views/seasons/_season_form.html.erb + _date_field.html.erb) labels its fields with
  # bare `f.label :attr` on a `form_with model: @season` builder, so Rails resolves each caption
  # through `Season.human_attribute_name(:attr)` at render time. That lookup is not a literal
  # `t("activerecord.attributes.season.…")` call the static scan can credit, so every one of these
  # leaves reads as unused despite genuine runtime use — same pattern as the user.{last_name,
  # first_name} entries above. Leaf-listed (not a `season.*` wildcard) so a real orphan would
  # still surface.
  - "activerecord.attributes.season.label"
  - "activerecord.attributes.season.nb_lessons"
  - "activerecord.attributes.season.start"
  - "activerecord.attributes.season.end"
  - "activerecord.attributes.season.opening_date_for_applications"
  - "activerecord.attributes.season.opening_date_for_new_applications"
  - "activerecord.attributes.season.closing_date_for_applications"
  - "activerecord.attributes.season.date_for_teacher_planning_validation"
  - "activerecord.attributes.season.is_current"
  - "activerecord.attributes.season.next_season_id"
  - "devise.**"
  # Side/profile navigation captions. config/initializers/20-menu_generator.rb sets each menu
  # item's `caption:` to a `:"menu.<key>"` Symbol; lib/elvis/menu_manager.rb#caption then does
  # `I18n.t(@caption)` at render time. Neither the Symbol literal nor the dynamic `I18n.t` call
  # is a static `t("menu.…")` the scan can credit, so every menu key reads as unused.
  - "menu.*"
