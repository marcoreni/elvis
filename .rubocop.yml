Metrics:
    Enabled: false
Style/StringLiterals:
    EnforcedStyle: double_quotes

# This repo's established convention (visible throughout the codebase) is to write no
# top-level comments unless the *why* is genuinely non-obvious. Style/Documentation demands
# a comment above every class/module, which conflicts with that convention — bulk-adding
# boilerplate doc comments just to satisfy the cop would be noise, not a cleanup.
Style/Documentation:
    Enabled: false

AllCops:
    NewCops: enable
    # bin/* here are gem/bundler-generated binstubs (shakapacker, i18n-tasks, rails, ...), not
    # app code - regenerate via `bundle exec rake shakapacker:binstubs` / `bundle binstubs <gem>`
    # rather than hand-fixing lint offenses on them.
    Exclude:
        - "bin/**/*"
        - "db/schema.rb"
        - "db/migrate/**/*"
        # ERB generator templates (`<%= %>` placeholders), not real Ruby - RuboCop's parser
        # chokes on them as syntax errors.
        - "lib/generators/**/templates/**/*"
