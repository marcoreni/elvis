name: elvis_dev

# Backing services for a NATIVE dev setup (ruby/node run on the host, e.g. via asdf -- see
# .tool-versions and README). These are separate from the `elvis_dev` service below (which
# containerizes the whole app instead) and use distinct container names/volumes so both can
# coexist with the main docker-compose.yml stack without clashing.
#
# Usage: `docker-compose -f docker-compose-dev.yml up -d database redis elasticsearch`
# Credentials/ports match config/database.yml's development block and config/chewy.yml's
# development host as-is, so no extra env vars are needed for a native `rails server`.

services:
  elvis_dev:
    image: elvis:dev_run
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        - GITHUB_TOKEN=${GITHUB_TOKEN:?GITHUB_TOKEN is required}
        - PLUGINS_LIST_DOWNLOAD_URL=${PLUGINS_LIST_DOWNLOAD_URL}
    container_name: elvis_dev_run
    environment:
      - PORT=5000
    volumes:
      - .:/Elvis
    ports:
      - "8080:5000"
    command: ${COMMAND}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  database:
    image: postgres:14.0
    container_name: elvis_dev_database
    environment:
      - POSTGRES_USER=elvis
      - POSTGRES_PASSWORD=elvis
      - POSTGRES_DB=elvis
    volumes:
      - elvis_dev_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elvis"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6.2.6
    container_name: elvis_dev_redis
    volumes:
      - elvis_dev_redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.16.3
    container_name: elvis_dev_elasticsearch
    environment:
      - discovery.type=single-node
      - cluster.name=elasticsearch
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elvis_dev_elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: curl -s http://localhost:9200 >/dev/null || exit 1
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  elvis_dev_postgres_data:
  elvis_dev_redis_data:
  elvis_dev_elasticsearch_data:
