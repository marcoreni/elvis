name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# rubocop/tsc have large pre-existing backlogs (see docs/KnownIssues.md and
# docs/Modernization-Roadmap.md item 1) that shouldn't block unrelated PRs. Their jobs below
# gate on the count *increasing* past these baselines rather than on any offense/error at all.
# Lower the baseline whenever debt is paid down; raising it should only happen with a good reason.
env:
  RUBOCOP_BASELINE_OFFENSES: 1037
  TSC_BASELINE_ERRORS: 5

jobs:
  rspec:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14.0
        env:
          POSTGRES_USER: elvis
          POSTGRES_PASSWORD: elvis
          POSTGRES_DB: elvis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elvis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.16.3
        env:
          discovery.type: single-node
          bootstrap.memory_lock: "true"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200 >/dev/null || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --ulimit memlock=-1:-1
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # Recent GitHub-hosted Ubuntu runners already default vm.max_map_count high enough for
      # ES 7.x, but bump it explicitly so this doesn't silently start failing on a runner-image
      # change (see docker-compose.yml, which relies on the same ES version).
      - name: Raise vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - run: yarn install --frozen-lockfile

      # plugins.json is gitignored and absent from a fresh checkout, so PluginGemUtils installs
      # zero plugin gems here (see lib/elvis/plugin_gem_utils.rb) — no GITHUB_TOKEN needed for
      # core CI. Plugin-gem coverage is out of scope for this workflow.
      - name: Prepare test database
        env:
          RAILS_ENV: test
        run: bin/rails db:create db:schema:load

      # A stale/missing public/packs-test/ manifest causes ~100+ spurious RSpec failures in
      # request/feature specs that render react_component views — build it up front rather than
      # relying on shakapacker's test-env compile-on-demand (config/shakapacker.yml `compile: true`
      # under `test:`), which isn't reliable in CI. See docs/Modernization-Roadmap.md item 1.
      - name: Build test webpack manifest
        env:
          RAILS_ENV: test
          NODE_ENV: test
        run: bin/shakapacker

      - name: Run RSpec
        env:
          RAILS_ENV: test
        run: bundle exec rspec

  i18n-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      # bin/i18n-tasks, not `bundle exec i18n-tasks` — the global binstub crashes on a missing
      # logger in this repo (see docs/ i18n notes).
      - run: bin/i18n-tasks health

  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn vitest run

  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Type-check (fails only on regression past baseline)
        run: |
          set +e
          npx tsc --noEmit >tsc_output.log 2>&1
          cat tsc_output.log
          count=$(grep -c "error TS" tsc_output.log)
          echo "TypeScript errors: $count (baseline: $TSC_BASELINE_ERRORS)"
          if [ "$count" -gt "$TSC_BASELINE_ERRORS" ]; then
            echo "::error::tsc error count increased ($count > $TSC_BASELINE_ERRORS baseline) - fix the regression, or if these are pre-existing errors being paid down, lower TSC_BASELINE_ERRORS in .github/workflows/ci.yml"
            exit 1
          fi

  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Rubocop (fails only on regression past baseline)
        run: |
          set +e
          bundle exec rubocop --format simple --format json --out rubocop_output.json
          count=$(ruby -rjson -e "puts JSON.parse(File.read('rubocop_output.json'))['summary']['offense_count']")
          echo "Rubocop offenses: $count (baseline: $RUBOCOP_BASELINE_OFFENSES)"
          if [ "$count" -gt "$RUBOCOP_BASELINE_OFFENSES" ]; then
            echo "::error::rubocop offense count increased ($count > $RUBOCOP_BASELINE_OFFENSES baseline) - fix the regression, or if this is pre-existing debt being paid down, lower RUBOCOP_BASELINE_OFFENSES in .github/workflows/ci.yml"
            exit 1
          fi
